<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Brote limpia el planeta: separar residuos en el tacho correcto y programar secuencias de flechas.">
<title>Brote limpia el planeta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<!-- Letra redonda y emojis de respaldo. Sin internet (pendrive) se usan las letras de la compu y el juego anda igual. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
</head>
<body>

<!-- ============ Pantalla de inicio ============ -->
<main class="inicio" id="inicio" aria-labelledby="tituloInicio">
  <header class="inicio-cab">
    <div class="inicio-heroe" id="heroeInicio" aria-hidden="true"></div>
    <div>
      <h1 id="tituloInicio"></h1>
      <p class="inicio-sub" id="subInicio"></p>
    </div>
    <button class="menu-btn" data-abre-menu aria-expanded="false" aria-controls="menu" aria-label="Menú"><span></span><span></span><span></span></button>
  </header>
  <div class="mundos" id="tarjetasMundos"></div>
</main>

<!-- ============ Juego ============ -->
<div class="game" id="juego" hidden>
  <header class="topbar">
    <h1 id="tituloJuego"></h1>
    <span class="pill" id="pillNivel"></span>
    <button class="menu-btn" id="menuBtn" data-abre-menu aria-expanded="false" aria-controls="menu" aria-label="Menú"><span></span><span></span><span></span></button>
  </header>

  <section class="planet-box" aria-label="Estado del planeta">
    <div class="planet-wrap" id="planeta"></div>
    <div class="planet-info">
      <div class="meter" aria-hidden="true"><div id="meterFill"></div></div>
      <p class="clean-text" id="cleanText"></p>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <p class="msg" id="msg" aria-live="polite"></p>

  <section class="stage">
    <div class="board-area"><div class="board" id="board" aria-label="Tablero de juego"></div></div>
    <div class="legend" id="leyenda"></div>
  </section>

  <section class="controls" aria-label="Controles">
    <div class="carry" id="carryBox">
      <div class="slot" id="carrySlot"></div>
      <div class="ctext" id="carryText"></div>
      <span class="shieldtag" id="shieldTag" hidden>🛡️</span>
      <button class="btn-voz" id="btnVoz" aria-label="Escuchar" title="Escuchar">🔊</button>
    </div>
    <div class="dpad">
      <button data-dir="up">↑</button>
      <button data-dir="left">←</button>
      <div class="center" id="dpadCenter"></div>
      <button data-dir="right">→</button>
      <button data-dir="down">↓</button>
    </div>
    <div class="right-controls">
      <div class="mode" id="selectorModo"></div>
      <div class="prog" id="prog" hidden>
        <ol class="queue" id="queue"></ol>
        <div class="prog-actions">
          <button id="undoBtn">⌫</button>
          <button id="clearBtn"></button>
          <button id="stepBtn" class="step"></button>
          <button id="runBtn" class="primary"></button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ============ Menú ☰ (sirve para el inicio y para el juego) ============ -->
<nav class="menu" id="menu" hidden aria-label="Menú del juego">
  <button class="menu-item" data-accion="inicio" data-solo-juego></button>
  <button class="menu-item" data-accion="comoJugar"></button>
  <button class="menu-item" data-accion="guia"></button>
  <button class="menu-item" data-accion="dibujo"></button>
  <button class="menu-item" data-accion="anterior" data-solo-juego></button>
  <button class="menu-item" data-accion="reiniciar" data-solo-juego></button>
  <button class="menu-item" data-accion="saltar" data-solo-juego></button>
  <button class="menu-item keep" data-accion="sonido"></button>
  <a class="menu-item" data-accion="docentes" href="docentes/index.html" target="_blank" rel="noopener" hidden></a>
  <button class="menu-item keep" data-accion="config" id="cfgBtn" aria-expanded="false" aria-controls="settings"></button>
  <section class="settings" id="settings" hidden aria-label="Configuración">
    <div class="set-group">
      <p class="set-title" id="tPersonaje"></p>
      <div class="skins" id="skins"></div>
      <p class="set-hint" id="creditoPersonaje"></p>
    </div>
    <div class="set-group">
      <p class="set-title" id="tLetras"></p>
      <button class="switch" id="capsBtn" role="switch" aria-checked="false">
        <span class="track"><span class="knob"></span></span>
        <span id="tMayus"></span>
      </button>
      <p class="set-hint" id="tMayusAyuda"></p>
    </div>
    <div class="set-group">
      <label class="set-title" for="nameInput" id="tVecino"></label>
      <input id="nameInput" type="text" maxlength="12" autocomplete="off">
      <p class="set-hint" id="tVecinoAyuda"></p>
    </div>
  </section>
</nav>

<!-- ============ Ventanas ============ -->
<div class="overlay" id="helpOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h2 id="helpTitle"></h2>
    <div id="helpBody"></div>
    <div class="actions"><button class="btn" data-cierra="helpOv" id="helpClose"></button></div>
  </div>
</div>

<div class="overlay" id="guideOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
    <h2 id="guideTitle"></h2>
    <div class="guide" id="guideBody"></div>
    <div class="actions"><button class="btn" data-cierra="guideOv" id="guideClose"></button></div>
  </div>
</div>

<div class="overlay" id="doneOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <h2 id="doneTitle"></h2>
    <div class="stars" id="stars"></div>
    <p id="doneText"></p>
    <div class="actions">
      <button class="btn ghost" id="replayBtn"></button>
      <button class="btn" id="nextBtn"></button>
    </div>
  </div>
</div>

<div class="final" id="finalOv" hidden role="dialog" aria-modal="true" aria-labelledby="finalTitle">
  <div class="earth-wrap">
    <svg class="earth" viewBox="0 0 300 300" aria-hidden="true">
      <defs>
        <clipPath id="ec"><circle cx="150" cy="150" r="120"/></clipPath>
        <radialGradient id="esh" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
          <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#001" stop-opacity=".45"/>
        </radialGradient>
        <g id="conts" fill="#46B060">
          <path d="M20 70 C50 50 110 55 120 85 C125 110 95 120 85 140 C75 150 60 145 50 130 C35 115 10 100 20 70Z"/>
          <path d="M85 155 C100 150 118 165 112 190 C106 215 96 240 86 246 C80 230 75 205 72 185 C70 170 75 158 85 155Z"/>
          <path d="M130 40 C145 32 168 36 162 49 C150 56 135 53 130 40Z" fill="#E8F4F2"/>
          <path d="M200 70 C215 60 240 65 245 80 C238 92 220 95 205 90 C198 85 195 76 200 70Z"/>
          <path d="M205 105 C230 98 260 110 262 135 C265 165 245 200 230 215 C220 200 212 180 205 160 C195 140 190 115 205 105Z" fill="#5DBB5F"/>
          <path d="M255 60 C300 45 370 55 390 80 C400 100 375 120 345 118 C320 125 300 115 280 110 C262 104 245 80 255 60Z"/>
          <path d="M360 170 C380 160 410 168 412 185 C412 200 390 207 372 200 C360 195 352 180 360 170Z" fill="#6CC262"/>
          <path d="M0 262 C120 250 360 250 480 262 V300 H0Z" fill="#E8F4F2"/>
        </g>
        <g id="clds" fill="#fff">
          <ellipse cx="60" cy="110" rx="34" ry="9"/><ellipse cx="170" cy="60" rx="28" ry="7"/>
          <ellipse cx="260" cy="180" rx="38" ry="9"/><ellipse cx="380" cy="130" rx="30" ry="8"/><ellipse cx="440" cy="210" rx="26" ry="7"/>
        </g>
      </defs>
      <circle cx="150" cy="150" r="142" fill="#7FE0C3" opacity=".22"/>
      <circle cx="150" cy="150" r="120" fill="#2F86C9"/>
      <g clip-path="url(#ec)">
        <g class="spin"><use href="#conts"/><use href="#conts" x="480"/></g>
        <g class="clouds" opacity=".75"><use href="#clds"/><use href="#clds" x="480"/></g>
      </g>
      <circle cx="150" cy="150" r="120" fill="url(#esh)"/>
      <ellipse cx="98" cy="172" rx="14" ry="8" fill="#FF8FA3" opacity=".8"/>
      <ellipse cx="202" cy="172" rx="14" ry="8" fill="#FF8FA3" opacity=".8"/>
      <g class="eye"><ellipse cx="118" cy="142" rx="10" ry="14" fill="#15222B"/><circle cx="121" cy="136" r="3.6" fill="#fff"/></g>
      <g class="eye"><ellipse cx="182" cy="142" rx="10" ry="14" fill="#15222B"/><circle cx="185" cy="136" r="3.6" fill="#fff"/></g>
      <path d="M120 172 Q150 206 180 172 Z" fill="#15222B"/>
      <path d="M137 187 Q150 197 163 187 Q150 181 137 187Z" fill="#FF6B81"/>
    </svg>
    <span class="spark emo" style="left:0;top:8%">✨</span>
    <span class="spark emo" style="right:4%;top:2%;animation-delay:.6s">✨</span>
    <span class="spark emo" style="left:6%;bottom:12%;animation-delay:1.1s">🌱</span>
    <span class="spark emo" style="right:30%;top:-4%;animation-delay:.3s">⭐</span>
    <div class="final-robot" id="finalRobot"></div>
    <div class="jail" aria-label="El vecino en la cárcel">
      <span class="jail-sign" id="jailSign"></span>
      <div class="jail-cell">
        <span class="fig emo">🚶</span>
        <svg class="jail-bars" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g stroke="#C9CFD9" stroke-width="6" stroke-linecap="round">
            <line x1="14" y1="4" x2="14" y2="96"/><line x1="28" y1="4" x2="28" y2="96"/>
            <line x1="72" y1="4" x2="72" y2="96"/><line x1="86" y1="4" x2="86" y2="96"/>
          </g>
          <rect x="3" y="3" width="94" height="94" rx="6" fill="none" stroke="#9AA3B2" stroke-width="7"/>
        </svg>
      </div>
      <span class="jail-name hname"></span>
    </div>
  </div>
  <h2 id="finalTitle"></h2>
  <p id="finalText"></p>
  <div class="final-botones">
    <button class="btn ghost-final" id="finalInicio"></button>
    <button class="btn" id="finalBtn"></button>
  </div>
</div>

<div class="overlay sheet-ov" id="sheetOv" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="sheet-close btn" data-cierra="sheetOv" id="sheetClose"></button>
    <h2 class="sheet-title" id="sheetTitle"></h2>
    <p class="sheet-credito" id="sheetCredito"></p>
    <div class="sheet-grid" id="sheetGrid"></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
